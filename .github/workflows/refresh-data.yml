name: Refresh volleyball data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh data
        run: npm run scrape

      - name: Check for data changes
        id: data_changed
        run: |
          if git diff --quiet -I '"updatedAt":' -- data-*.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed data
        if: steps.data_changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-*.json
          git commit -m "Refresh volleyball data"
          git push

      - name: Skip deploy if no data changed
        if: steps.data_changed.outputs.changed != 'true'
        run: echo "No data changes detected; skipping commit."